<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="900" height="220" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- 装饰网格点 -->
  <g opacity="0.15">
    <circle cx="50" cy="40" r="1.5" fill="#38bdf8"/>
    <circle cx="100" cy="40" r="1.5" fill="#38bdf8"/>
    <circle cx="150" cy="40" r="1.5" fill="#38bdf8"/>
    <circle cx="200" cy="40" r="1.5" fill="#38bdf8"/>
    <circle cx="50" cy="80" r="1.5" fill="#38bdf8"/>
    <circle cx="100" cy="80" r="1.5" fill="#38bdf8"/>
    <circle cx="150" cy="80" r="1.5" fill="#38bdf8"/>
    <circle cx="200" cy="80" r="1.5" fill="#38bdf8"/>
    <circle cx="700" cy="140" r="1.5" fill="#818cf8"/>
    <circle cx="750" cy="140" r="1.5" fill="#818cf8"/>
    <circle cx="800" cy="140" r="1.5" fill="#818cf8"/>
    <circle cx="850" cy="140" r="1.5" fill="#818cf8"/>
    <circle cx="700" cy="180" r="1.5" fill="#818cf8"/>
    <circle cx="750" cy="180" r="1.5" fill="#818cf8"/>
    <circle cx="800" cy="180" r="1.5" fill="#818cf8"/>
    <circle cx="850" cy="180" r="1.5" fill="#818cf8"/>
  </g>

  <!-- 状态小圆点 -->
  <circle cx="52" cy="50" r="5" fill="#22c55e"/>
  <text x="68" y="54" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SYSTEM ONLINE · 18Y COMBAT ARCHITECT</text>

  <!-- 主标题 -->
  <text x="50" y="105" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5">Yasin | AI &amp; E-Commerce Architect</text>

  <!-- 分割线 -->
  <line x1="50" y1="125" x2="850" y2="125" stroke="url(#lineGrad)" stroke-width="1.5"/>

  <!-- 副标题与价值主张 -->
  <text x="50" y="155" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
    Focusing on <tspan fill="#f1f5f9" font-weight="600">Enterprise Multi-Agent Swarms</tspan>, <tspan fill="#f1f5f9" font-weight="600">Stealth Anti-Bot Crawlers</tspan> &amp; <tspan fill="#f1f5f9" font-weight="600">High-Conversion Cross-Border Pipelines</tspan>.
  </text>
  <text x="50" y="180" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" font-style="italic">
    "Code is cheap. Business logic, supply-chain defense &amp; real ROI are the true moat."
  </text>
</svg>
